    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var savedTheme = localStorage.getItem('discoveryrmm-color-scheme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.querySelector('meta[name="color-scheme"]').setAttribute('content', savedTheme);
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0e14" media="(prefers-color-scheme: dark)" />

    <meta
      name="description"
      content="DiscoveryRMM é uma plataforma RMM open source para operações de TI: inventário de endpoints, monitoramento, acesso remoto, proxy LAN, RDP/WebRDP, automação, chamados com SLA e suporte assistido por IA. Servidor .NET 10 + PostgreSQL + NATS, agent Windows e console web."
    />
    <meta name="author" content="pedrostefanogv" />
    <meta
      name="keywords"
      content="RMM, Remote Monitoring and Management, open source, inventário de ativos, monitoramento de endpoints, acesso remoto, RDP, WebRDP, proxy LAN, automação de TI, ITSM, PowerShell, .NET, NATS, PostgreSQL"
